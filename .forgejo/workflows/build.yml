name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  rust:
    name: Rust quality checks and build
    runs-on: ci-rust
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test runtime with optional assets
        run: cargo test --locked -p nine_dev_site_lib --all-features

      - name: Check local OTLP export
        run: |
          cargo build --locked -p nine_dev_site_lib --features telemetry --example telemetry_smoke
          python3 scripts/check_otlp.py

      - name: Build
        run: cargo build --locked
