[package]
name = "nine_dev_site_lib"
version = "0.4.0"
edition.workspace = true
description = "Fingerprinted browser assets: icons, Catppuccin palettes, a theme switcher, and optional HTMX"
repository = "https://git.9dev.tech/9-Developers/9dev-site-lib"
# Rust code is BSD-3-Clause; icons and palette are MIT; HTMX is 0BSD.
license = "BSD-3-Clause AND MIT AND 0BSD"

[features]
htmx = []

[dependencies]
askama = { version = "0.16", default-features = false, features = [
  "derive",
  "std",
] }

[build-dependencies]
nine_dev_site_build = { path = "../nine_dev_site_build", version = "0.1.1" }

[dev-dependencies]
sha2 = "0.11"
