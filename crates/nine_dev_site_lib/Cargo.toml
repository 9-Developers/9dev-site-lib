[package]
name = "nine_dev_site_lib"
version = "0.2.1"
edition.workspace = true
description = "Embedded brand, interface, and theme icons with fingerprinted asset lookup"
repository = "https://git.9dev.tech/9-Developers/9dev-site-lib"
# Rust code is BSD-3-Clause; the bundled icon artwork is MIT.
license = "BSD-3-Clause AND MIT"

[dependencies]
askama = { version = "0.16", default-features = false, features = [
  "derive",
  "std",
] }

[build-dependencies]
nine_dev_site_build = { path = "../nine_dev_site_build", version = "0.1.1" }

[dev-dependencies]
sha2 = "0.11"
